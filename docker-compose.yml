# ============================================================
# GenPosFit — Genryphem Posture and Fit
# Docker Compose: MySQL + Backend + Frontend + PhpMyAdmin
# ============================================================

services:

  # ------------------------- DATABASE -------------------------
  db:
    image: mysql:8.0
    container_name: genposfit-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql # persistensi data
      - ./database/init:/docker-entrypoint-initdb.d # auto-run schema saat pertama kali
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - genposfit-net

  # ------------------------- BACKEND --------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genposfit-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy # tunggu MySQL benar-benar siap
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      # Reward token GPC (Ethereum Sepolia Testnet) - hanya untuk tombol
      # distribusi manual di Dashboard Admin.
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL}
      GPC_CONTRACT_ADDRESS: ${GPC_CONTRACT_ADDRESS}
      GPC_TREASURY_PRIVATE_KEY: ${GPC_TREASURY_PRIVATE_KEY}
      GPC_REWARDS_ENABLED: ${GPC_REWARDS_ENABLED:-0}
      GPC_REWARD_SCHEDULE: ${GPC_REWARD_SCHEDULE:-1:1000,2:600,3:400}
    ports:
      - "${BACKEND_PORT}:8042"
    volumes:
      - ./backend:/app # hot-reload saat development
      - ./database:/database # seed scripts & migration access
    command: uvicorn app.main:app --host 0.0.0.0 --port 8042 --reload
    networks:
      - genposfit-net

  # ------------------------- FRONTEND -------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: genposfit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_PROXY: http://backend:8042
      NEXT_PUBLIC_API_URL: http://backend:8042
    ports:
      - "${FRONTEND_PORT}:3042"
    volumes:
      - ./frontend:/app
      - /app/node_modules # jangan timpa node_modules container
    networks:
      - genposfit-net

  # ------------------------- PHPMYADMIN -----------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: genposfit-phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "${PMA_PORT}:80"
    networks:
      - genposfit-net

# ========================= VOLUMES & NETWORK ==================
volumes:
  db_data:
    name: genposfit-db-data

networks:
  genposfit-net:
    name: genposfit-network
    driver: bridge
