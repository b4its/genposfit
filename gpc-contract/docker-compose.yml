# GPC Smart Contract (ERC-1155) — Compose terpisah dari stack utama
# Dijalankan dari root project dengan: docker compose -f gpc-contract/docker-compose.yml --project-directory .
name: genposfit-gpc

services:
  gpc:
    build:
      context: ./gpc-contract
      dockerfile: Dockerfile
    container_name: genposfit-gpc
    env_file:
      - path: ./gpc-contract/.env
        required: false
      - path: ./.env
        required: false
    environment:
      - SEPOLIA_RPC_URL
      - PRIVATE_KEY
      - ETHERSCAN_API_KEY
      - TARGET
      - AMOUNT
    volumes:
      - ./gpc-contract:/app
      - gpc_node_modules:/app/node_modules

volumes:
  gpc_node_modules: